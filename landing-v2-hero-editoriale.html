    <title>Hero editoriale · Landing V2 (prototipo)</title>
    <!-- Scuro, the default, paints dark from the first frame, before the script and its CSS arrive:
         ?v= picks the palette and &modo= the mode as initialConfig does (config.ts lists the palettes
         in this order), and main.tsx keeps both in sync. Attuale's dark page is below the logo's
         black. -->
    <script>
      {
        const params = new URLSearchParams(location.search);
        const palettes = ["attuale", "logo", "caldo", "arancione"];
        const v = Number.parseInt(params.get("v") ?? "", 10);
        const index = Number.isNaN(v) ? 0 : v - 1;
        const html = document.documentElement;
        html.dataset.palette = palettes[((index % 4) + 4) % 4];
        html.dataset.mode = params.get("modo") === "chiaro" ? "chiaro" : "scuro";
      }
    </script>
    <style>html[data-mode=scuro],html[data-mode=scuro] body{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;background:oklch(18.2% 0 0)}html[data-mode=scuro][data-palette=attuale],html[data-mode=scuro][data-palette=attuale] body{background:oklch(13% 0 0)}</style>
